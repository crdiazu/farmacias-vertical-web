services:
  postgres:
    image: postgres:16-alpine
    container_name: fv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farmacias_vertical
    ports:
      - '5432:5432'
    volumes:
      - fv_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: fv_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - fv_minio:/data

volumes:
  fv_pgdata:
  fv_minio:
